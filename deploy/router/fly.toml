# The panel front door: https://<id>.app.winq.site -> customer bot app winq-b-<id> (fly-replay).
# Deploy: docker build -f deploy/router/Dockerfile -t registry.fly.io/winq-router:<tag> . && docker push ...
#         fly deploy --config deploy/router/fly.toml --image registry.fly.io/winq-router:<tag>
app = "winq-router"
primary_region = "fra"

[env]
  PUBLIC_DOMAIN = "app.winq.site"
  APP_PREFIX = "winq-b-"
  BRAND_NAME = "Winq"
  HOME_URL = "https://winq.site"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "5s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "3s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
