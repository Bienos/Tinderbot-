<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#fff6f8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assets/landing.css"><title>Załóż konto · {{BRAND}}</title></head><body class="auth-page">
<header class="nav"><a class="brand" href="/"><svg viewBox="0 0 24 24" class="mark" aria-hidden="true"><defs><linearGradient id="fire" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fd267a"/><stop offset="1" stop-color="#ff6036"/></linearGradient></defs><path fill="url(#fire)" d="M12.9 2.2c.3 2.4-.6 4-2 5.5-1.3 1.4-2.7 2.8-2.7 5.1 0 1.2.5 2.2 1.2 2.9-.1-1.7.7-2.8 1.8-3.6 1.1-.8 2-1.9 2.1-3.6 2.5 1.8 4 4.3 4 7.1 0 3.6-2.8 6.4-6.6 6.4S4 20.2 4 16.6c0-3.8 2.2-6.4 4.4-8.4 2.2-2 4-3.4 4.5-6z"/></svg>{{BRAND}}</a><nav aria-label="Konto"><a href="/zaloguj">Zaloguj się</a></nav></header>
<main class="auth"><div class="auth-card">
<h1>Załóż konto</h1><p>Beta jest dla niewielkiej grupy: każda osoba dostaje własny serwer. Po aktywacji konta otworzysz panel jednym kliknięciem.</p>
<form id="register-form" novalidate>
<div class="row2"><label>E-mail<input type="email" name="email" autocomplete="email" required></label>
<label><span>Imię <span class="opt">(opcjonalnie)</span></span><input type="text" name="name" autocomplete="given-name" maxlength="60"></label></div>
<label>Hasło <input type="password" name="password" autocomplete="new-password" minlength="10" required><span class="hint">Co najmniej 10 znaków.</span></label>
<label>Jak chcesz korzystać?<select name="mode"><option value="drafts">Szkice: zatwierdzam każdą wiadomość</option><option value="autopilot">Autopilot w wybranych rozmowach</option><option value="unsure">Jeszcze nie wiem</option></select></label>
<label class="hp" aria-hidden="true">Strona<input type="text" name="website" tabindex="-1" autocomplete="off"></label>
<label class="check"><input type="checkbox" name="adult" required> Mam ukończone 18 lat.</label>
<label class="check"><input type="checkbox" name="terms" required> Akceptuję <a href="/regulamin" target="_blank">regulamin</a> i <a href="/prywatnosc" target="_blank">politykę prywatności</a>.</label>
<label class="check"><input type="checkbox" name="marketing"> Chcę dostawać informacje o nowościach (opcjonalnie).</label>
<button class="btn" type="submit">Załóż konto</button><p id="form-result" role="status"></p>
</form>
<p class="auth-alt">Masz już konto? <a href="/zaloguj">Zaloguj się</a></p>
</div></main><script src="/assets/account.js" defer></script></body></html>
