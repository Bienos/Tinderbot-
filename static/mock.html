<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fictional Dating Chat — Test Environment</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,Arial,sans-serif;color:#1a1a1a;background:#fbf5eb}
body{margin:0}header{padding:18px 26px;background:#171715;color:#fff}header small{color:#ccc}main{display:grid;grid-template-columns:235px 1fr;height:calc(100vh - 77px)}
aside{border-right:1px solid #ded6cc;padding:20px}.thread{width:100%;text-align:left;border:0;background:transparent;padding:14px 12px;border-radius:12px;cursor:pointer;font-size:15px}.thread.active{background:#ffddc2}
.chat{display:flex;flex-direction:column;padding:22px 30px}.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px}.bubble{max-width:60%;padding:12px 16px;border-radius:18px;background:#fff;align-self:flex-start}.bubble.you{background:#ff6a00;color:#fff;align-self:flex-end}footer{display:flex;gap:10px;padding-top:14px}textarea{flex:1;border-radius:12px;padding:12px;font:inherit;resize:none;border:1px solid #cfc4b8}button.send{border:0;background:#171715;color:#fff;border-radius:12px;padding:0 20px;cursor:pointer}
</style></head><body>
<header><strong>Fictional dating chat</strong><div><small>Local sandbox. All profiles and messages are synthetic. No Tinder connection.</small></div></header>
<main><aside id="threads"></aside><section class="chat"><div id="chatTitle"><h2>Conversations</h2></div><div class="msgs" id="messages"></div><footer><textarea rows="2" data-chat-input placeholder="Test message"></textarea><button class="send" data-send-button>Send</button></footer></section></main>
<script src="/static/mock.js" defer></script></body></html>
