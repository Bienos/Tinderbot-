name: Fly bot image

# Builds the customer-bot image (deploy/fly/Dockerfile) and pushes it to registry.fly.io with two tags:
#   :git-<sha>  unique, for rolling existing bots forward (POST /admin/fly/update-image on the control service)
#   :latest     what FLY_IMAGE points at, so new customers get the newest build
# Runs only once the repository secret FLY_API_TOKEN exists (see docs/FLY.md); without it the job is skipped.

on:
  push:
    branches: [main]
    paths: ['app.py', 'agent/**', 'static/**', 'data/**', 'requirements.lock', 'deploy/fly/**', '.github/workflows/fly-image.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: ${{ vars.FLY_IMAGE_APP || 'iskra-obraz-e96u' }}
    steps:
      - name: Fly configured?
        id: ready
        run: |
          if [ -n "$FLY_API_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "No FLY_API_TOKEN secret yet, skipping the build." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.ready.outputs.ok == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master
      - if: steps.ready.outputs.ok == 'true'
        name: Build and push (unique tag)
        run: |
          TAG="git-${GITHUB_SHA::12}"
          flyctl deploy --build-only --push --remote-only --app "$APP" \
            --config deploy/fly/fly.image.toml --dockerfile deploy/fly/Dockerfile --image-label "$TAG"
          echo "IMAGE=registry.fly.io/$APP:$TAG" >> "$GITHUB_ENV"
      - if: steps.ready.outputs.ok == 'true'
        name: Also tag as latest
        run: |
          flyctl auth docker
          docker pull "$IMAGE"
          docker tag "$IMAGE" "registry.fly.io/$APP:latest"
          docker push "registry.fly.io/$APP:latest"
      - if: steps.ready.outputs.ok == 'true'
        name: Summary
        run: |
          echo "Built $IMAGE (also :latest)." >> "$GITHUB_STEP_SUMMARY"
          echo "Roll existing bots: POST /admin/fly/update-image {\"image\": \"$IMAGE\"}" >> "$GITHUB_STEP_SUMMARY"
